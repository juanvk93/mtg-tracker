# CI: comprueba cada push y pull request a main antes de que Render despliegue.
# Para que Render espere a este check: Settings → Build & Deploy → Auto-Deploy →
# "After CI Checks Pass".
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Formato, vet, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formato (gofmt)
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin formatear (ejecuta gofmt -w):"
            echo "$sin_formato"
            exit 1
          fi

      - name: go.mod y go.sum al día
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Build (igual que el Dockerfile)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/server

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t mtg-tracker:ci .
